name: release

# Заливает готовый EngineOptimizer.tmod из ветки ci-build в GitHub Release
# (создаёт релиз, если его ещё нет). Прямой upload ассетов из песочницы
# блокируется хостом uploads.github.com, а раннеру доступен весь интернет.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (например, v0.8.8)'
        required: true
        default: 'v0.8.8'

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Attach .tmod to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          REPO="${GITHUB_REPOSITORY}"
          echo "Релиз: $TAG"

          step() { if out=$(eval "$1" 2>&1); then echo "[ok] $2"; else echo "::error::$2: $(echo "$out" | tr '\n' ' ' | head -c 300)"; exit 1; fi }

          step "git clone --quiet --depth 1 --branch ci-build https://github.com/${REPO}.git /tmp/ci" "clone-ci-build"
          step "ls /tmp/ci/*.tmod" "tmod-exists"
          step "cp /tmp/ci/EngineOptimizer.tmod ." "copy"

          # v1.1: авто-changelog — коммиты между предыдущим тегом и текущим.
          git clone --quiet https://github.com/${REPO}.git /tmp/src >/dev/null 2>&1 || true
          CHANGELOG=""
          if [ -d /tmp/src ]; then
            cd /tmp/src
            git fetch --quiet --tags >/dev/null 2>&1 || true
            PREV=$(git tag --sort=-creatordate 2>/dev/null | grep -v "^${TAG}$" | head -n 1 || true)
            if [ -n "$PREV" ]; then
              CHANGELOG=$(git log --oneline --no-merges "${PREV}..${TAG}" 2>/dev/null | sed 's/^/- /' || true)
            fi
            cd "$OLDPWD"
          fi

          NOTES="Сборка на tModLoader 2026.08.3.0 (stable).
          Установка: .tmod положить в %USERPROFILE%\\Documents\\My Games\\Terraria\\tModLoader\\Mods\\ и включить в игре (старую версию заменить).

          ## Изменения

          ${CHANGELOG:-- См. README.md и историю коммитов.}

          Свежие сборки — ветка ci-build и артефакты Actions."

          # -R: без checkout раннер не в git-репозитории, gh сам репо не найдёт
          if gh release view "$TAG" -R "$REPO" >/dev/null 2>&1; then
            step "gh release upload '$TAG' EngineOptimizer.tmod --clobber -R '$REPO'" "upload-existing"
            step "gh release edit '$TAG' -R '$REPO' --notes \"\$NOTES\"" "update-notes"
          else
            step "gh release create '$TAG' EngineOptimizer.tmod -R '$REPO' --title 'EngineOptimizer $TAG' --notes \"\$NOTES\"" "create-with-asset"
          fi
          echo "Готово: ассет залит в $TAG"
