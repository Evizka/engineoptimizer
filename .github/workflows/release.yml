name: release

# Заливает готовый EngineOptimizer.tmod из ветки ci-build в GitHub Release.
# Прямой upload ассетов из песочницы блокируется хостом uploads.github.com,
# а раннеру Actions доступен весь интернет — поэтому через него.

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      tag:
        description: 'Тег релиза (например, v0.8.8)'
        required: true
        default: 'v0.8.8'

permissions:
  contents: write

jobs:
  attach:
    runs-on: ubuntu-latest
    steps:
      - name: Attach .tmod to release
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          TAG="${{ inputs.tag || github.ref_name }}"
          echo "Релиз: $TAG"

          step() { if out=$(eval "$1" 2>&1); then echo "[ok] $2"; else echo "::error::$2: $(echo "$out" | tr '\n' ' ' | head -c 300)"; exit 1; fi }

          step "git clone --quiet --depth 1 --branch ci-build https://github.com/${GITHUB_REPOSITORY}.git /tmp/ci" "clone-ci-build"
          step "ls /tmp/ci/*.tmod" "tmod-exists"
          step "cp /tmp/ci/EngineOptimizer.tmod ." "copy"
          # -R: без checkout раннер не в git-репозитории, gh сам репо не найдёт
          step "gh release upload '$TAG' EngineOptimizer.tmod --clobber -R '${GITHUB_REPOSITORY}'" "upload"
          echo "Готово: ассет залит в $TAG"
