name: build

# Сборка мода на настоящем tModLoader. Результат (EngineOptimizer.tmod)
# пушится в ветку ci-build (одиночный коммит, force) + аттачится артефактом.
on:
  push:
    branches-ignore: [ci-build]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Download tModLoader (2026.08.3.0 stable)
        shell: bash
        run: |
          set -euo pipefail
          curl -fL -o tModLoader.zip "https://github.com/tModLoader/tModLoader/releases/download/v2026.08.3.0/tModLoader.zip"
          mkdir -p tML
          unzip -q tModLoader.zip -d tML
          echo "--- содержимое tML ---"
          ls -la tML | head -40
          test -f tML/tModLoader.dll || { echo "tModLoader.dll не найден"; exit 1; }
          test -f tML/tMLMod.targets || { echo "tMLMod.targets не найден"; ls tML; exit 1; }

      - name: Build mod
        shell: bash
        run: |
          set -euo pipefail
          dotnet --info | head -5
          dotnet build -c Release -p:TerrariaSteamPath="$GITHUB_WORKSPACE/tML/"

      - name: Collect output
        shell: bash
        run: |
          set -euo pipefail
          echo "=== ищем .tmod по всей системе ==="
          find / -name '*.tmod' -not -path '/proc/*' -not -path '/sys/*' 2>/dev/null | head -20 || true
          echo "=== HOME/.local/share ==="
          ls -laR "$HOME/.local/share/Terraria" 2>/dev/null | head -60 || true
          echo "=== HOME/Documents ==="
          find "$HOME/Documents" -maxdepth 4 2>/dev/null | head -40 || true
          echo "=== workspace .tmod ==="
          find "$GITHUB_WORKSPACE" -name '*.tmod' || true
          echo "=== логи tML ==="
          find / -path /proc -prune -o -iname '*.log' -path '*Terraria*' -print 2>/dev/null | head -10 || true
          find / -path /proc -prune -o -iname '*.log' -path '*tModLoader*' -print 2>/dev/null | head -10 || true

          mkdir -p dist
          # старый .tmod из checkout лежит в корне workspace — исключаем его
          find / -name '*.tmod' -not -path '/proc/*' -not -path '/sys/*' \
               -not -path "$GITHUB_WORKSPACE/EngineOptimizer.tmod" \
               -not -path '*/obj/*' -not -path '*/bin/*' 2>/dev/null \
               -exec cp {} dist/ \; || true
          echo "--- dist ---"
          ls -la dist

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: EngineOptimizer-tmod
          path: dist/*
          if-no-files-found: warn

      - name: Push .tmod to ci-build branch
        if: ${{ hashFiles('dist/*.tmod') != '' }}
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -uo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          step() { if out=$(eval "$1" 2>&1); then echo "[ok] $2"; else echo "::error::$2: $(echo "$out" | tr '\n' ' ' | head -c 220)"; exit 1; fi }

          step "git checkout --orphan ci-build" "checkout-orphan"
          step "git rm -rf -q ." "git-rm"
          step "cp dist/*.tmod ." "copy-tmod"
          step "git add -f *.tmod" "git-add"
          step "git commit -m 'EngineOptimizer build of ${GITHUB_SHA::12}'" "commit"

          if out=$(git push --force origin ci-build 2>&1); then
            echo "[ok] push"
          else
            echo "::warning::git push failed ($(echo "$out" | tr '\n' ' ' | head -c 220)) — trying Contents API"
            # Фолбэк: ветка + файл через GitHub API (gh есть на раннере).
            REPO="repos/${GITHUB_REPOSITORY}"
            BASE=$(gh api "$REPO/git/ref/heads/main" --jq .object.sha)
            if ! gh api "$REPO/git/ref/heads/ci-build" >/dev/null 2>&1; then
              gh api "$REPO/git/refs" -f ref="refs/heads/ci-build" -f sha="$BASE" >/dev/null
            fi
            for F in *.tmod; do
              B64=$(base64 -w0 "$F")
              EXISTING=$(gh api "$REPO/contents/$F?ref=ci-build" --jq .sha 2>/dev/null || true)
              if [ -n "$EXISTING" ]; then
                gh api -X PUT "$REPO/contents/$F" -f message="EngineOptimizer build of ${GITHUB_SHA::12}" -f content="$B64" -f branch=ci-build -f sha="$EXISTING" >/dev/null
              else
                gh api -X PUT "$REPO/contents/$F" -f message="EngineOptimizer build of ${GITHUB_SHA::12}" -f content="$B64" -f branch=ci-build >/dev/null
              fi
            done
            echo "[ok] uploaded via API"
          fi
